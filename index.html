<style>

<script>
'use strict';
/* =====================================================================
   PHẦN 1: HÀM THUẦN (không chạm DOM) - scramble, trung bình, định dạng.
   Các hàm này có thể kiểm tra độc lập bằng node.
   ===================================================================== */

// --- Scramble 3x3 kiểu WCA: 20 nước, không có 2 nước liên tiếp cùng mặt,
// --- không có 3 nước liên tiếp cùng trục (ví dụ R L R).
const SCRAMBLE_FACES = ['U', 'D', 'R', 'L', 'F', 'B'];
const SCRAMBLE_AXIS = { U: 0, D: 0, R: 1, L: 1, F: 2, B: 2 };
const SCRAMBLE_SUFFIX = ['', "'", '2'];
function generateScramble(len) {
  len = len || 20;
  const moves = [];
  let prev = null, prevPrev = null;
  while (moves.length < len) {
    const face = SCRAMBLE_FACES[Math.floor(Math.random() * 6)];
    if (face === prev) continue;
    if (prev && prevPrev && SCRAMBLE_AXIS[face] === SCRAMBLE_AXIS[prev] && SCRAMBLE_AXIS[prev] === SCRAMBLE_AXIS[prevPrev]) continue;
    moves.push(face + SCRAMBLE_SUFFIX[Math.floor(Math.random() * 3)]);
    prevPrev = prev;
    prev = face;
  }
  return moves.join(' ');
}

// --- Số lượt bị bỏ ở mỗi đầu khi tính trung bình (chuẩn WCA / csTimer):
// --- Ao3: 0 (mean of 3, không bỏ lượt nào). Ao5: 1. Còn lại: 5% làm tròn lên
// --- (Ao12: 1, Ao15: 1, Ao50: 3, Ao100: 5).
function trimCount(n) {
  if (n <= 3) return 0;
  if (n === 5) return 1;
  return Math.ceil(n * 0.05);
}

// --- Trung bình của N lượt cuối trong mảng solves (theo thứ tự thời gian).
// --- Trả về { status: 'not-enough' } nếu chưa đủ N lượt,
// --- { status: 'dnf' } nếu trung bình là DNF,
// --- { status: 'ok', value: mili-giây } nếu tính được.
// --- DNF được coi là lượt tệ nhất: nếu sau khi bỏ các lượt ở 2 đầu mà
// --- vẫn còn DNF trong các lượt giữ lại thì kết quả là DNF.
function averageOf(solves, n) {
  if (solves.length < n) return { status: 'not-enough' };
  const last = solves.slice(-n);
  const trim = trimCount(n);
  const sorted = last.slice().sort(function (a, b) {
    if (a.time === null && b.time === null) return 0;
    if (a.time === null) return 1;   // DNF xếp cuối (tệ nhất)
    if (b.time === null) return -1;
    return a.time - b.time;
  });
  const kept = sorted.slice(trim, sorted.length - trim);
  if (kept.some(function (s) { return s.time === null; })) return { status: 'dnf' };
  let sum = 0;
  for (const s of kept) sum += s.time;
  return { status: 'ok', value: sum / kept.length };
}

// --- Trung bình tốt nhất trong mọi cửa sổ N lượt liên tiếp.
// --- Trả về { status: 'not-enough' | 'dnf' | 'ok', value } như averageOf.
function bestAverageOf(solves, n) {
  if (solves.length < n) return { status: 'not-enough' };
  let best = null;
  for (let i = 0; i <= solves.length - n; i++) {
    const r = averageOf(solves.slice(i, i + n), n);
    if (r.status === 'ok' && (best === null || r.value < best)) best = r.value;
  }
  if (best === null) return { status: 'dnf' };
  return { status: 'ok', value: best };
}

// --- Lượt nhanh nhất (bỏ qua DNF). Trả về mili-giây hoặc null.
function bestSingle(solves) {
  let best = null;
  for (const s of solves) {
    if (s.time !== null && (best === null || s.time < best)) best = s.time;
  }
  return best;
}

// --- Trung bình cộng của các lượt không DNF. Trả về mili-giây hoặc null.
function meanOf(solves) {
  let sum = 0, count = 0;
  for (const s of solves) {
    if (s.time !== null) { sum += s.time; count++; }
  }
  return count === 0 ? null : sum / count;
}

// --- Độ lệch chuẩn (quần thể) của các lượt không DNF. Trả về mili-giây
// --- hoặc null nếu chưa đủ 2 lượt hợp lệ.
function stddevOf(solves) {
  const vals = [];
  for (const s of solves) if (s.time !== null) vals.push(s.time);
  if (vals.length < 2) return null;
  let sum = 0;
  for (const v of vals) sum += v;
  const mean = sum / vals.length;
  let sq = 0;
  for (const v of vals) sq += (v - mean) * (v - mean);
  return Math.sqrt(sq / vals.length);
}

// --- Định dạng thời gian: cắt (truncate) về 0.01s như WCA, dạng M:SS.cc.
function fmt(ms) {
  if (ms === null || ms === undefined || ms < 0) return 'DNF';
  const totalCenti = Math.floor(ms / 10);
  const m = Math.floor(totalCenti / 6000);
  const s = Math.floor(totalCenti / 100) % 60;
  const c = totalCenti % 100;
  return m + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');
}

// --- Định dạng trung bình: WCA làm tròn trung bình tới 0.01s gần nhất.
function fmtAvg(ms) {
  if (ms === null || ms === undefined) return 'DNF';
  return fmt(Math.round(ms / 10) * 10);
}

// --- Hiển thị một lượt giải: "12.34+", "12.34" hoặc "DNF".
function fmtSolve(s) {
  if (s.time === null) return 'DNF';
  return fmt(s.time) + (s.plus2 ? '+' : '');
}

// --- Hiển thị kết quả averageOf/bestAverageOf: "-" nếu chưa đủ lượt.
function fmtAverageResult(r) {
  if (r.status === 'not-enough') return '-';
  if (r.status === 'dnf') return 'DNF';
  return fmtAvg(r.value);
}

/* __PURE_END__ */

/* =====================================================================
   PHẦN 2: DỮ LIỆU (localStorage) VÀ TRẠNG THÁI
   ===================================================================== */

// Một lượt giải: { id, raw, time, plus2, scramble, date, note }
// - raw: thời gian đo được (ms, đã cắt về 0.01s), null nếu DNF do quá giờ nhìn.
// - time: thời gian cuối cùng sau phạt (null = DNF).
// - plus2: đã cộng 2 giây hay chưa.
const LS_SOLVES = 'cubetimer.solves.v1';
const LS_SETTINGS = 'cubetimer.settings.v1';

function validSolve(s) {
  return s && typeof s.id === 'string' && typeof s.scramble === 'string' &&
    typeof s.date === 'number' && (s.time === null || typeof s.time === 'number') &&
    (s.raw === null || s.raw === undefined || typeof s.raw === 'number');
}
function loadSolves() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_SOLVES) || '[]');
    if (!Array.isArray(arr)) return [];
    return arr.filter(validSolve).map(function (s) {
      return { id: s.id, raw: (s.raw === undefined ? s.time : s.raw), time: s.time,
               plus2: !!s.plus2, scramble: s.scramble, date: s.date, note: s.note || '' };
    });
  } catch (e) { return []; }
}
function saveSolves() {
  try { localStorage.setItem(LS_SOLVES, JSON.stringify(solves)); } catch (e) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}');
    return { inspection: s.inspection !== false, beep: s.beep !== false };
  } catch (e) { return { inspection: true, beep: true }; }
}
function saveSettings() {
  try { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); } catch (e) {}
}

const $ = function (sel) { return document.querySelector(sel); };
function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

let solves = loadSolves();
let settings = loadSettings();
let currentView = 'timer'; // 'timer' | 'history'
let detailSolveId = null;

// Trạng thái bấm giờ: 'idle' | 'inspecting' | 'running'
// Luồng chạm: 1 lần = inspection 15s, chạm tiếp = bắt đầu giải,
// chạm = dừng, chạm 2 lần liên tiếp = hoàn tác lượt vừa giải.
let phase = 'idle';
let inspectStart = 0;  // performance.now() lúc bắt đầu nhìn trước
let solveStart = 0;    // performance.now() lúc bắt đầu chạy giờ
let pendingPlus2 = false;
let beeped8 = false, beeped12 = false;
let currentScramble = generateScramble();
let rafId = null;
let audioCtx = null;

const TAP_WINDOW_MS = 300;  // 2 lần chạm trong 300ms = chạm đúp (hoàn tác)
const INSPECT_MS = 15000;   // nhìn trước 15s
const INSPECT_DNF_MS = 17000; // quá 17s: DNF
const PLUS2_MS = 2000;

/* =====================================================================
   PHẦN 3: BẤM GIỜ (máy trạng thái)
   ===================================================================== */

function startLoop() {
  if (rafId === null) rafId = requestAnimationFrame(loop);
}
function stopLoop() {
  if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
}

function loop() {
  if (phase === 'idle') { rafId = null; return; }
  if (currentView !== 'timer') { cancelTiming(); return; }
  const now = performance.now();
  if (phase === 'inspecting') {
    const elapsed = now - inspectStart;
    if (elapsed >= INSPECT_DNF_MS) { recordInspectionDnf(); return; }
    if (elapsed >= 8000 && !beeped8) { beeped8 = true; beep(); }
    if (elapsed >= 12000 && !beeped12) { beeped12 = true; beep(); }
    if (elapsed >= INSPECT_MS) pendingPlus2 = true;
  }
  updateClock();
  rafId = requestAnimationFrame(loop);
}

// Chạm (hoặc Space): nhận ngay khi vừa chạm xuống, không chờ.
// - Đang chạy: dừng. Chạm đúp ngay sau khi bắt đầu giải (< 300ms) = hoàn tác.
// - Đang nhìn trước: bắt đầu giải. Chạm đúp ngay sau khi bắt đầu nhìn (< 300ms) = hoàn tác.
// - Đang nghỉ: bắt đầu inspection (hoặc giải luôn nếu tắt inspection).
function handleTap() {
  if (currentView !== 'timer' || modalOpen() || inputFocused()) return;
  ensureAudio();
  if (phase === 'running') {
    if (solves.length && performance.now() - solveStart < TAP_WINDOW_MS) {
      phase = 'idle';
      document.body.classList.remove('running');
      stopLoop();
      undoLastSolve();
      return;
    }
    stopSolve();
    return;
  }
  if (phase === 'inspecting') {
    if (solves.length && performance.now() - inspectStart < TAP_WINDOW_MS) {
      phase = 'idle';
      stopLoop();
      undoLastSolve();
      return;
    }
    startSolve();
    return;
  }
  startInspectionOrSolve();
}

function startInspectionOrSolve() {
  if (phase !== 'idle' || currentView !== 'timer') return;
  hideRecordToast();
  setStatus('');
  if (settings.inspection) {
    inspectStart = performance.now();
    beeped8 = false; beeped12 = false;
    pendingPlus2 = false;
    phase = 'inspecting';
    startLoop();
  } else {
    startSolve();
  }
  updateClock();
}

// Bị ngắt giữa chừng (ví dụ rời màn hình Timer khi đang nhìn trước): hủy lượt.
function cancelTiming() {
  if (phase !== 'inspecting') return;
  phase = 'idle';
  stopLoop();
  renderTimer();
}

function startSolve() {
  if (phase === 'inspecting' && performance.now() - inspectStart >= INSPECT_MS) {
    pendingPlus2 = true; // bắt đầu trong khoảng 15-17s: +2
  }
  solveStart = performance.now();
  phase = 'running';
  document.body.classList.add('running');
  updateClock();
}

function stopSolve() {
  const raw = Math.floor((performance.now() - solveStart) / 10) * 10; // cắt về 0.01s
  const newTime = raw + (pendingPlus2 ? PLUS2_MS : 0);
  const record = checkRecord(solves, newTime);
  solves.push({
    id: makeId(), raw: raw, time: newTime,
    plus2: pendingPlus2, scramble: currentScramble, date: Date.now(), note: '',
  });
  saveSolves();
  currentScramble = generateScramble();
  phase = 'idle';
  document.body.classList.remove('running');
  stopLoop();
  renderTimer();
  if (record) showRecordToast(record);
}

let recordToastTimer = null;
// So lượt mới với các lượt đã có: 'best' nếu nhanh nhất, 'worst' nếu chậm nhất, null nếu không phá kỉ lục.
function checkRecord(prevSolves, time) {
  if (time === null) return null;
  let best = Infinity, worst = -Infinity, n = 0;
  for (const s of prevSolves) {
    if (s.time === null) continue;
    n++;
    if (s.time < best) best = s.time;
    if (s.time > worst) worst = s.time;
  }
  if (!n) return null;
  if (time < best) return 'best';
  if (time > worst) return 'worst';
  return null;
}
function showRecordToast(kind) {
  const toast = $('#record-toast');
  const title = toast.querySelector('.rt-title');
  const sub = toast.querySelector('.rt-sub');
  if (kind === 'best') {
    toast.className = 'record-toast best show';
    title.textContent = '🎉 Adu đạt kỉ lục kìa!';
    sub.textContent = BEST_PHRASES[Math.floor(Math.random() * BEST_PHRASES.length)];
  } else {
    toast.className = 'record-toast worst show';
    title.textContent = '😂 Ủa chậm vl thôi';
    sub.textContent = 'Đừng buồn bạn, sau cơn mưa thì trời ơi là trời';
    try {
      const audio = new Audio(HAHA_AUDIO);
      audio.play().catch(function () {});
    } catch (e) {}
  }
  clearTimeout(recordToastTimer);
  recordToastTimer = setTimeout(function () { toast.className = 'record-toast'; }, 4500);
}
function hideRecordToast() {
  clearTimeout(recordToastTimer);
  $('#record-toast').className = 'record-toast';
}

// Hoàn tác lượt vừa giải: xóa lượt đó và quay về scramble vừa giải.
function undoLastSolve() {
  if (!solves.length) return;
  hideRecordToast();
  const last = solves.pop();
  currentScramble = last.scramble;
  saveSolves();
  setStatus('Đã hoàn tác lượt vừa giải');
  setTimeout(function () {
    if ($('#status').textContent === 'Đã hoàn tác lượt vừa giải') setStatus('');
  }, 2500);
  renderTimer();
}

// Quá 17s nhìn trước: ghi luôn 1 lượt DNF, đổi scramble mới.
function recordInspectionDnf() {
  solves.push({
    id: makeId(), raw: null, time: null, plus2: false,
    scramble: currentScramble, date: Date.now(), note: '',
  });
  saveSolves();
  currentScramble = generateScramble();
  phase = 'idle';
  stopLoop();
  setStatus('DNF - quá 17s nhìn trước');
  renderTimer();
}

// Âm báo ngắn (WebAudio). AudioContext chỉ mở được sau một thao tác của người dùng.
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep() {
  if (!settings.beep || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

/* =====================================================================
   PHẦN 4: HIỂN THỊ MÀN HÌNH TIMER
   ===================================================================== */

function setStatus(text) { $('#status').textContent = text; }
function setHint(text) { $('#hint').textContent = text; }

// Vẽ đồng hồ theo trạng thái hiện tại. Gọi liên tục trong vòng lặp rAF.
function updateClock() {
  const clock = $('#clock');
  if (phase === 'running') {
    clock.textContent = fmt(performance.now() - solveStart);
    clock.className = 'clock running';
    setHint('Chạm để dừng');
    return;
  }
  if (phase === 'inspecting') {
    const elapsed = performance.now() - inspectStart;
    const remain = INSPECT_MS - elapsed;
    if (remain <= 0) {
      clock.textContent = '+2';
      clock.className = 'clock warn-red';
      setHint('Đang +2 - chạm để bắt đầu');
    } else {
      clock.textContent = String(Math.ceil(remain / 1000));
      if (elapsed >= 12000) clock.className = 'clock warn-red';
      else if (elapsed >= 8000) clock.className = 'clock warn-yellow';
      else clock.className = 'clock';
      setHint('Chạm để bắt đầu giải');
    }
    return;
  }
  // idle: hiện lượt vừa giải (hoặc 0:00.00 nếu chưa có lượt nào)
  const last = solves[solves.length - 1];
  clock.textContent = last ? fmtSolve(last) : '0:00.00';
  clock.className = 'clock';
  setHint(settings.inspection ? 'Chạm để bắt đầu inspection' : 'Chạm để bắt đầu');
}

// Hàng thống kê dưới màn hình Timer: trái là độ lệch/trung bình/tốt nhất/số lần,
// phải là bảng Ao3/5/15/50/100 (cột Hiện tại và Tốt nhất).
function statsRowHTML() {
  const sd = stddevOf(solves);
  const mean = meanOf(solves);
  const best = bestSingle(solves);
  let left = '<div class="sum-col">' +
    '<div><span>Độ lệch</span><b>' + (sd === null ? '--' : (sd / 1000).toFixed(2)) + '</b></div>' +
    '<div><span>Trung bình</span><b>' + (mean === null ? '--' : fmtAvg(mean)) + '</b></div>' +
    '<div><span>Tốt nhất</span><b>' + (best === null ? '--' : fmt(best)) + '</b></div>' +
    '<div><span>Số lần</span><b>' + solves.length + '</b></div></div>';
  let rows = '';
  for (const n of [3, 5, 15, 50, 100]) {
    rows += '<tr><td>Ao' + n + '</td><td class="num">' + fmtAverageResult(averageOf(solves, n)) +
      '</td><td class="num">' + fmtAverageResult(bestAverageOf(solves, n)) + '</td></tr>';
  }
  return left + '<div class="ao-col"><table>' +
    '<tr><th></th><th>Hiện tại</th><th>Tốt nhất</th></tr>' + rows + '</table></div>';
}

function renderTimer() {
  $('#scramble').textContent = currentScramble;
  $('#stats-row').innerHTML = statsRowHTML();
  const last = solves[solves.length - 1];
  $('#btn-plus2').disabled = !last || last.time === null;
  $('#btn-dnf').disabled = !last || (last.time === null && last.raw === null);
  $('#btn-del-last').disabled = !last;
  updateClock();
}

// +2 / DNF cho lượt vừa giải (nút trên màn hình Timer).
function togglePlus2(solve) {
  if (!solve || solve.time === null || solve.raw === null) return;
  solve.plus2 = !solve.plus2;
  solve.time = solve.raw + (solve.plus2 ? PLUS2_MS : 0);
  saveSolves();
}
function toggleDnf(solve) {
  if (!solve) return;
  if (solve.time !== null) {
    solve.time = null;
  } else if (solve.raw !== null) {
    solve.time = solve.raw + (solve.plus2 ? PLUS2_MS : 0);
  }
  saveSolves();
}

/* =====================================================================
   PHẦN 5: TRANG LỊCH SỬ, BIỂU ĐỒ, MODAL, XUẤT/NHẬP
   ===================================================================== */

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function modalOpen() {
  return !$('#detail-modal').classList.contains('hidden') ||
    !$('#settings-modal').classList.contains('hidden');
}
function inputFocused() {
  const el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
}

function setNav(view) {
  $('#nav-timer').classList.toggle('active', view === 'timer');
  $('#nav-history').classList.toggle('active', view === 'history');
}

function showHistory() {
  cancelTiming();
  currentView = 'history';
  $('#timer-view').classList.add('hidden');
  $('#history-view').classList.remove('hidden');
  setNav('history');
  renderHistory();
  drawChart();
}
function showTimer() {
  currentView = 'timer';
  $('#history-view').classList.add('hidden');
  $('#timer-view').classList.remove('hidden');
  setNav('timer');
  renderTimer();
}

function renderHistory() {
  const best = bestSingle(solves);
  const mean = meanOf(solves);
  let table = '<table><tr><th></th><th>Hiện tại</th><th>Tốt nhất</th></tr>';
  for (const n of [3, 5, 15, 50, 100]) {
    table += '<tr><td>Ao' + n + '</td><td class="num">' + fmtAverageResult(averageOf(solves, n)) +
      '</td><td class="num">' + fmtAverageResult(bestAverageOf(solves, n)) + '</td></tr>';
  }
  table += '</table>';
  $('#history-summary').innerHTML =
    '<div class="sum-line"><span>Lượt giải: <b>' + solves.length + '</b></span>' +
    '<span>Tốt nhất: <b>' + (best === null ? '-' : fmt(best)) + '</b></span>' +
    '<span>Mean: <b>' + (mean === null ? '-' : fmtAvg(mean)) + '</b></span></div>' + table;

  const list = $('#history-list');
  if (solves.length === 0) {
    list.innerHTML = '<div class="empty-msg">Chưa có lượt giải nào.</div>';
    return;
  }
  let html = '';
  for (let i = solves.length - 1; i >= 0; i--) {
    const s = solves[i];
    const upTo = solves.slice(0, i + 1);
    const ao5 = fmtAverageResult(averageOf(upTo, 5));
    const ao12 = fmtAverageResult(averageOf(upTo, 12));
    const d = new Date(s.date);
    const dateStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
      ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
    html += '<div class="solve-row" data-id="' + s.id + '">' +
      '<span class="idx">#' + (i + 1) + '</span>' +
      '<span class="time' + (s.time === null ? ' dnf' : '') + '">' + escapeHtml(fmtSolve(s)) + '</span>' +
      '<span class="scr">' + escapeHtml(s.scramble) + '</span>' +
      '<span class="ao">Ao5 ' + ao5 + ' · Ao12 ' + ao12 + '</span>' +
      '<span class="date">' + dateStr + (s.note ? ' &#9998;' : '') + '</span>' +
      '</div>';
  }
  list.innerHTML = html;
}

// Biểu đồ đường thời gian theo từng lượt (canvas thuần, không thư viện).
function drawChart() {
  const canvas = $('#chart');
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = 180;
  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.round(height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const valid = solves.filter(function (s) { return s.time !== null; }).map(function (s) { return s.time; });
  if (valid.length < 2) {
    ctx.fillStyle = '#999';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Cần ít nhất 2 lượt giải để vẽ biểu đồ', width / 2, height / 2);
    return;
  }
  let min = Math.min.apply(null, valid), max = Math.max.apply(null, valid);
  if (min === max) { min -= 1000; max += 1000; }
  const padL = 58, padR = 12, padT = 12, padB = 22;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const xAt = function (i) { return padL + (solves.length <= 1 ? 0 : (i / (solves.length - 1)) * plotW); };
  const yAt = function (t) { return padT + (1 - (t - min) / (max - min)) * plotH; };
  // Lưới ngang + nhãn thời gian.
  ctx.strokeStyle = '#e0e0e0';
  ctx.fillStyle = '#999';
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  for (let g = 0; g <= 4; g++) {
    const v = min + (max - min) * g / 4;
    const gy = yAt(v);
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(width - padR, gy);
    ctx.stroke();
    ctx.fillText(fmt(v), padL - 6, gy + 4);
  }
  // Đường thời gian, đứt đoạn ở DNF.
  ctx.strokeStyle = '#43a047';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let penDown = false;
  solves.forEach(function (s, i) {
    if (s.time === null) { penDown = false; return; }
    if (!penDown) { ctx.moveTo(xAt(i), yAt(s.time)); penDown = true; }
    else ctx.lineTo(xAt(i), yAt(s.time));
  });
  ctx.stroke();
  // Chấm từng lượt.
  ctx.fillStyle = '#2e7d32';
  solves.forEach(function (s, i) {
    if (s.time === null) return;
    ctx.beginPath();
    ctx.arc(xAt(i), yAt(s.time), 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
  // Nhãn trục X.
  ctx.fillStyle = '#999';
  ctx.textAlign = 'left';
  ctx.fillText('#1', padL, height - 6);
  ctx.textAlign = 'right';
  ctx.fillText('#' + solves.length, width - padR, height - 6);
}

// --- Modal chi tiết lượt giải ---
function openDetail(id) {
  const idx = solves.findIndex(function (s) { return s.id === id; });
  if (idx === -1) return;
  detailSolveId = id;
  const s = solves[idx];
  const upTo = solves.slice(0, idx + 1);
  $('#detail-title').textContent = 'Lượt #' + (idx + 1);
  $('#detail-body').innerHTML =
    '<div class="detail-line">Thời gian: <b>' + escapeHtml(fmtSolve(s)) + '</b></div>' +
    '<div class="detail-line">Scramble: ' + escapeHtml(s.scramble) + '</div>' +
    '<div class="detail-line">Ngày giờ: ' + new Date(s.date).toLocaleString('vi-VN') + '</div>' +
    '<div class="detail-line">Ao5 lúc đó: <b>' + fmtAverageResult(averageOf(upTo, 5)) +
    '</b> · Ao12 lúc đó: <b>' + fmtAverageResult(averageOf(upTo, 12)) + '</b></div>';
  $('#detail-note').value = s.note || '';
  $('#detail-plus2').disabled = s.time === null;
  $('#detail-dnf').disabled = s.time === null && s.raw === null;
  $('#detail-modal').classList.remove('hidden');
}
function closeDetail() {
  $('#detail-modal').classList.add('hidden');
  detailSolveId = null;
}
function openSettings() {
  $('#set-inspection').checked = settings.inspection;
  $('#set-beep').checked = settings.beep;
  $('#settings-modal').classList.remove('hidden');
}
function closeSettings() {
  $('#settings-modal').classList.add('hidden');
}

// --- Xuất / Nhập dữ liệu ---
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function exportJSON() {
  downloadBlob(JSON.stringify(solves, null, 2), 'cube-timer.json', 'application/json');
}
function exportCSV() {
  const q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
  let csv = '\uFEFFSTT,Thời gian (giây),Scramble,Ngày giờ,Ghi chú\n';
  solves.forEach(function (s, i) {
    csv += (i + 1) + ',' + (s.time === null ? 'DNF' : (s.time / 1000).toFixed(2) + (s.plus2 ? '+' : '')) +
      ',' + q(s.scramble) + ',' + q(new Date(s.date).toLocaleString('vi-VN')) + ',' + q(s.note || '') + '\n';
  });
  downloadBlob(csv, 'cube-timer.csv', 'text/csv;charset=utf-8');
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const arr = JSON.parse(reader.result);
      if (!Array.isArray(arr)) throw new Error('not array');
      const existing = new Set(solves.map(function (s) { return s.id; }));
      let added = 0;
      for (const s of arr) {
        if (!validSolve(s) || existing.has(s.id)) continue;
        solves.push({ id: s.id, raw: (s.raw === undefined ? s.time : s.raw), time: s.time,
          plus2: !!s.plus2, scramble: s.scramble, date: s.date, note: s.note || '' });
        existing.add(s.id);
        added++;
      }
      solves.sort(function (a, b) { return a.date - b.date; });
      saveSolves();
      renderHistory();
      renderTimer();
      alert('Đã nhập ' + added + ' lượt giải mới.');
    } catch (e) {
      alert('File JSON không hợp lệ.');
    }
  };
  reader.readAsText(file);
}

/* =====================================================================
   PHẦN 6: SỰ KIỆN VÀ KHỞI ĐỘNG
   ===================================================================== */

// Chạm vào màn hình Timer (trừ nút bấm, ô nhập): nhận ngay khi vừa chạm xuống
// (pointerdown) nên nhấn nhanh hay nhấn giữ đều có tác dụng như nhau.
$('#timer-view').addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('button, a, input, select, textarea, label')) return;
  handleTap();
});
$('#timer-view').addEventListener('contextmenu', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeDetail(); closeSettings(); return; }
  if (inputFocused() || modalOpen()) return;
  if (currentView !== 'timer') return;
  if (e.repeat) return;
  if (e.code === 'Space') {
    e.preventDefault();
    handleTap();
  } else if (phase === 'running' && !e.metaKey && !e.ctrlKey && !e.altKey &&
    e.code !== 'ShiftLeft' && e.code !== 'ShiftRight' &&
    e.code !== 'ControlLeft' && e.code !== 'ControlRight' &&
    e.code !== 'AltLeft' && e.code !== 'AltRight' &&
    e.code !== 'MetaLeft' && e.code !== 'MetaRight' && e.code !== 'CapsLock') {
    stopSolve(); // phím bất kỳ để dừng
  }
});

// Nhả focus khỏi nút sau khi bấm để Space không bấm lại nút đó.
document.addEventListener('click', function (e) {
  if (e.target && e.target.tagName === 'BUTTON') e.target.blur();
});

$('#btn-plus2').addEventListener('click', function () {
  togglePlus2(solves[solves.length - 1]);
  renderTimer();
});
$('#btn-dnf').addEventListener('click', function () {
  toggleDnf(solves[solves.length - 1]);
  renderTimer();
});
$('#btn-del-last').addEventListener('click', function () {
  if (!solves.length) return;
  solves.pop();
  saveSolves();
  renderTimer();
});
$('#nav-history').addEventListener('click', showHistory);
$('#nav-timer').addEventListener('click', showTimer);
$('#settings-close').addEventListener('click', closeSettings);
$('#set-inspection').addEventListener('change', function (e) {
  settings.inspection = e.target.checked;
  saveSettings();
});
$('#set-beep').addEventListener('change', function (e) {
  settings.beep = e.target.checked;
  saveSettings();
});
$('#btn-export-json').addEventListener('click', exportJSON);
$('#btn-export-csv').addEventListener('click', exportCSV);
$('#btn-import').addEventListener('click', function () { $('#file-import').click(); });
$('#file-import').addEventListener('change', function (e) {
  if (e.target.files.length) importJSON(e.target.files[0]);
  e.target.value = '';
});
$('#btn-clear-all').addEventListener('click', function () {
  if (!solves.length) return;
  if (confirm('Xóa toàn bộ ' + solves.length + ' lượt giải?')) {
    solves = [];
    saveSolves();
    renderHistory();
    renderTimer();
  }
});
$('#history-list').addEventListener('click', function (e) {
  const row = e.target.closest('.solve-row');
  if (row) openDetail(row.dataset.id);
});
$('#detail-close').addEventListener('click', closeDetail);
$('#detail-save').addEventListener('click', function () {
  const s = solves.find(function (x) { return x.id === detailSolveId; });
  if (s) { s.note = $('#detail-note').value; saveSolves(); }
  closeDetail();
  renderHistory();
});
$('#detail-plus2').addEventListener('click', function () {
  const s = solves.find(function (x) { return x.id === detailSolveId; });
  togglePlus2(s);
  openDetail(detailSolveId);
  renderHistory();
  renderTimer();
});
$('#detail-dnf').addEventListener('click', function () {
  const s = solves.find(function (x) { return x.id === detailSolveId; });
  toggleDnf(s);
  openDetail(detailSolveId);
  renderHistory();
  renderTimer();
});
$('#detail-delete').addEventListener('click', function () {
  if (!confirm('Xóa lượt giải này?')) return;
  solves = solves.filter(function (x) { return x.id !== detailSolveId; });
  saveSolves();
  closeDetail();
  renderHistory();
  renderTimer();
});
document.querySelectorAll('.modal').forEach(function (m) {
  m.addEventListener('click', function (e) {
    if (e.target === m) { closeDetail(); closeSettings(); }
  });
});
window.addEventListener('resize', function () {
  if (currentView === 'history') drawChart();
});

// Khởi động.
$('#set-inspection').checked = settings.inspection;
$('#set-beep').checked = settings.beep;
renderTimer();
</script>
